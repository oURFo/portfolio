<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="瀏覽遊戲、生活工具、學習資源與 EMT 作品。">
  <title>悠揚製所</title>
  <link rel="stylesheet" href="./style.css?v=mobile-viewer-2">
  <script src="./app.js?v=mobile-viewer-2" defer></script>
</head>
<body>
  <a class="skip" href="#content">跳至作品</a>
  <aside class="sidebar">
    <a class="brand" href="#all"><span aria-hidden="true">✦</span> 悠揚製所</a>
    <nav id="categories" aria-label="作品分類"></nav>
    <p id="visitor-counter" data-endpoint="https://script.google.com/macros/s/AKfycbxGzXy53cSGB1q00-YYLVxC-bpWCNum4SJKga8yN1geI24P2f30QukWlUYDqq0zBjhJ/exec" hidden>
      累計訪客（估算） <strong id="visitor-total" role="status"></strong>
    </p>
  </aside>
  <main id="content">
    <div id="catalog">
      <header class="toolbar">
        <div>
          <h1 id="category-title" tabindex="-1">全部作品</h1>
          <p id="result-count" role="status"></p>
        </div>
        <label class="search">
          <span>搜尋作品</span>
          <input type="search" id="search" placeholder="輸入名稱或關鍵字">
        </label>
      </header>
      <div class="grid" id="projects"></div>
      <noscript>請啟用 JavaScript 以瀏覽作品。</noscript>
    </div>
    <section id="project-viewer" aria-labelledby="viewer-title" hidden>
      <header class="viewer-bar">
        <a id="viewer-back" href="#all">返回作品</a>
        <h1 id="viewer-title"></h1>
        <button id="viewer-expand" type="button" aria-pressed="false" hidden>全螢幕</button>
        <a id="viewer-external" target="_blank" rel="noopener noreferrer">新分頁開啟</a>
      </header>
      <p id="viewer-message" role="status" hidden></p>
      <div id="viewer-frame"></div>
    </section>
    <template id="project-template">
      <article class="card">
        <img class="cover" alt="" width="1280" height="720" decoding="async">
        <div class="details">
          <span class="tag"></span>
          <h2></h2>
          <p></p>
          <a class="open" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </article>
    </template>
  </main>
</body>
</html>
